<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify Transaction PIN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    background:white;
    width:100%;
    max-width:420px;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.card h2{
    margin-bottom:10px;
    color:#222;
}

.card p{
    color:#666;
    margin-bottom:25px;
    font-size:14px;
}

.pin-display{
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:38px;
    letter-spacing:18px;
    margin-bottom:25px;
    font-weight:bold;
}

.keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.key{
    height:75px;
    border:none;
    background:#f7f7f7;
    font-size:28px;
    font-weight:bold;
    border-radius:15px;
    cursor:pointer;
    transition:.2s;
}

.key:hover{
    background:#ececec;
}

.key:active{
    transform:scale(.96);
}

.submit-btn{
    margin-top:20px;
    width:100%;
    background:#D71E28;
    color:white;
    border:none;
    padding:16px;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn:disabled{
    background:#bbb;
    cursor:not-allowed;
}

</style>
</head>

<body>

<div class="card">

    <h2>Verify Transaction PIN</h2>

    <p>Enter the PIN provided by your administrator</p>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="pin-display" id="display">
            ○ ○ ○ ○
        </div>

        <input type="hidden" name="pin" id="pin">

        <div class="keypad">

            <button type="button" class="key" onclick="addDigit('1')">1</button>
            <button type="button" class="key" onclick="addDigit('2')">2</button>
            <button type="button" class="key" onclick="addDigit('3')">3</button>

            <button type="button" class="key" onclick="addDigit('4')">4</button>
            <button type="button" class="key" onclick="addDigit('5')">5</button>
            <button type="button" class="key" onclick="addDigit('6')">6</button>

            <button type="button" class="key" onclick="addDigit('7')">7</button>
            <button type="button" class="key" onclick="addDigit('8')">8</button>
            <button type="button" class="key" onclick="addDigit('9')">9</button>

            <button type="button" class="key" onclick="clearPin()">C</button>
            <button type="button" class="key" onclick="addDigit('0')">0</button>
            <button type="button" class="key" onclick="backspace()">←</button>

        </div>

        <button type="submit" class="submit-btn" id="verifyBtn" disabled>
            Verify PIN
        </button>

    </form>

</div>

<script>

let pin = "";

function addDigit(num){

    if(pin.length < 4){
        pin += num;
        updateDisplay();
    }
}

function clearPin(){
    pin = "";
    updateDisplay();
}

function backspace(){
    pin = pin.slice(0,-1);
    updateDisplay();
}

function updateDisplay(){

    document.getElementById("pin").value = pin;

    let display = "";

    for(let i = 0; i < 4; i++){
        display += i < pin.length ? "● " : "○ ";
    }

    document.getElementById("display").innerHTML = display;

    document.getElementById("verifyBtn").disabled = pin.length !== 4;
}

</script>

</body>
</html>
